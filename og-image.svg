<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="1" y="0" fill="#e53e3e" opacity="0.6"/>
  <rect width="1200" height="1" y="629" fill="#e53e3e" opacity="0.6"/>

  <!-- Dartboard graphic -->
  <g transform="translate(860, 315)">
    <circle r="240" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Segments alternating black/green -->
    <circle r="220" fill="#140808"/>
    <circle r="180" fill="none" stroke="#222" stroke-width="0.5"/>
    <circle r="130" fill="none" stroke="#222" stroke-width="0.5"/>
    <circle r="80"  fill="none" stroke="#222" stroke-width="0.5"/>
    <circle r="40"  fill="none" stroke="#222" stroke-width="0.5"/>
    <!-- Score rings -->
    <circle r="220" fill="none" stroke="#c0392b" stroke-width="12" stroke-dasharray="43 43.5" stroke-dashoffset="0" opacity="0.7"/>
    <circle r="130" fill="none" stroke="#1a7a35" stroke-width="12" stroke-dasharray="43 43.5" stroke-dashoffset="21.75" opacity="0.7"/>
    <!-- Bull -->
    <circle r="32" fill="#1a7a35"/>
    <circle r="16" fill="#c0392b"/>
    <circle r="6"  fill="#080808"/>
    <circle r="3"  fill="#e53e3e"/>
    <!-- Crosshairs -->
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#e53e3e" stroke-width="0.5" opacity="0.2"/>
    <line x1="0" y1="-220" x2="0" y2="220" stroke="#e53e3e" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Left content -->
  <text x="80" y="120" font-family="'Courier New', monospace" font-size="13" fill="#e53e3e" letter-spacing="4">DARTBOARD</text>
  <text x="80" y="145" font-family="'Courier New', monospace" font-size="11" fill="#444" letter-spacing="3">BUILT FROM THE BREACH</text>

  <line x1="80" y1="168" x2="680" y2="168" stroke="#222" stroke-width="1"/>

  <text x="80" y="260" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">REAL</text>
  <text x="80" y="340" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#e53e3e" letter-spacing="-2">INCIDENTS.</text>
  <text x="80" y="420" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">REAL</text>
  <text x="80" y="500" font-family="Georgia, serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">PRIORITIES.</text>

  <line x1="80" y1="536" x2="680" y2="536" stroke="#222" stroke-width="1"/>

  <text x="80" y="566" font-family="'Courier New', monospace" font-size="13" fill="#555" letter-spacing="1">8 priorities. Hundreds of real incidents. No fluff.</text>

  <!-- Live dot -->
  <circle cx="1120" cy="40" r="5" fill="#e53e3e" opacity="0.9"/>
  <text x="1132" y="44" font-family="'Courier New', monospace" font-size="11" fill="#e53e3e" letter-spacing="2">LIVE</text>

  <!-- URL -->
  <text x="80" y="610" font-family="'Courier New', monospace" font-size="12" fill="#333" letter-spacing="1">dartboard.david-clarke.id.au</text>
</svg>
